# LA Glass — site editor configuration
#
# Every field below maps to a value in /content/*.json. Saving here commits the
# change to GitHub, which triggers a rebuild and republishes the site.
#
# SETUP (see docs/ADMIN.md):
#   1. Deploy the sveltia-cms-auth Worker and add its URL as `base_url` below.
#   2. Give each editor write access to the repository on GitHub.
# DEPLOY-PROBE: auto-rebuild verified

backend:
  name: github
  repo: haykkhachikyan416-ai/LaGlass
  branch: main

# Lets the editor run against local files during development:
#   npx @sveltia/cms-proxy-server    then open http://localhost:3000/admin/
local_backend: true

media_folder: "public/img"
public_folder: "/img"

collections:
  - name: business
    label: "Business details"
    files:
      - name: site
        label: "Contact & business info"
        file: "content/site.json"
        description: "Phone, email, hours, social links and headline numbers."
        fields:
          - { name: name, label: "Business name", widget: string }
          - { name: tagline, label: "Tagline", widget: string }
          - { name: description, label: "Short description", widget: text }
          - { name: phoneDisplay, label: "Phone (shown on site)", widget: string }
          - { name: phoneHref, label: "Phone link (tel:+18185790569)", widget: string }
          - { name: email, label: "Email", widget: string }
          - { name: instagram, label: "Instagram URL", widget: string }
          - { name: tiktok, label: "TikTok URL", widget: string }
          - { name: hoursDays, label: "Open days", widget: string }
          - { name: hoursTime, label: "Open hours", widget: string }
          - { name: serviceAreaStatement, label: "Service area line", widget: string }
          - { name: yearsExperience, label: "Years of experience", widget: string }
          - { name: completedProjects, label: "Completed projects", widget: string }
          - { name: insured, label: "Insured", widget: boolean }
          - { name: freeEstimates, label: "Free estimates", widget: boolean }

  - name: homepage
    label: "Homepage"
    files:
      - name: home
        label: "Homepage sections"
        file: "content/home.json"
        fields:
          - { name: heroHeading, label: "Hero headline", widget: string }
          - { name: heroBody, label: "Hero paragraph", widget: text }
          - { name: heroPrimaryCta, label: "Hero main button", widget: string }
          - { name: heroSecondaryCta, label: "Hero second button", widget: string }
          - { name: servicesEyebrow, label: "Services label", widget: string }
          - { name: servicesHeading, label: "Services heading", widget: string }
          - { name: servicesCopy, label: "Services paragraph", widget: text }
          - { name: featuredEyebrow, label: "Featured label", widget: string }
          - { name: featuredHeading, label: "Featured heading", widget: string }
          - { name: featuredCopy, label: "Featured paragraph", widget: text }
          - { name: socialHeading, label: "Social heading", widget: string }
          - { name: socialCopy, label: "Social paragraph", widget: string }
          - { name: whyEyebrow, label: "Why us label", widget: string }
          - { name: whyHeading, label: "Why us heading", widget: string }
          - { name: whyCopy, label: "Why us paragraph", widget: text }
          - name: whyPoints
            label: "Why us points"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [ruler, wrench, sparkles, message, pin, images]
              - { name: title, label: Title, widget: string }
              - { name: copy, label: Text, widget: text }
          - { name: processEyebrow, label: "Process label", widget: string }
          - { name: processHeading, label: "Process heading", widget: string }
          - { name: processCopy, label: "Process paragraph", widget: string }
          - name: processSteps
            label: "Process steps"
            widget: list
            fields:
              - { name: number, label: "Number (01)", widget: string }
              - { name: title, label: Title, widget: string }
              - { name: copy, label: Text, widget: text }
          - { name: expectEyebrow, label: "What to expect label", widget: string }
          - { name: expectHeading, label: "What to expect heading", widget: string }
          - { name: expectCopy, label: "What to expect paragraph", widget: string }
          - name: expectPoints
            label: "What to expect points"
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: copy, label: Text, widget: text }
          - { name: areaEyebrow, label: "Service area label", widget: string }
          - { name: areaHeading, label: "Service area heading", widget: string }
          - { name: areaCopy, label: "Service area paragraph", widget: text }
          - { name: faqEyebrow, label: "FAQ label", widget: string }
          - { name: faqHeading, label: "FAQ heading", widget: string }
          - { name: ctaEyebrow, label: "Final CTA label", widget: string }
          - { name: ctaHeading, label: "Final CTA heading", widget: string }
          - { name: ctaCopy, label: "Final CTA paragraph", widget: text }
          - { name: ctaButton, label: "Final CTA button", widget: string }

      - name: about
        label: "About page"
        file: "content/about.json"
        fields:
          - { name: introEyebrow, label: "Intro label", widget: string }
          - { name: introHeading, label: "Intro heading", widget: string }
          - name: introParagraphs
            label: "Intro paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: craftEyebrow, label: "Standards label", widget: string }
          - { name: craftHeading, label: "Standards heading", widget: string }
          - { name: craftCopy, label: "Standards paragraph", widget: text }
          - name: craftPoints
            label: "Standards points"
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: copy, label: Text, widget: text }
          - { name: serveEyebrow, label: "Who we serve label", widget: string }
          - { name: serveHeading, label: "Who we serve heading", widget: string }
          - { name: serveCopy, label: "Who we serve paragraph", widget: text }
          - name: audiences
            label: "Who we serve list"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: [home, hardhat, compass, building]
              - { name: label, label: Label, widget: string }
          - { name: serveFootnote, label: "Who we serve footnote", widget: text }

      - name: pages
        label: "Other page headings"
        file: "content/pages.json"
        fields:
          - { name: aboutIntroEyebrow, label: "About label", widget: string }
          - { name: aboutIntroTitle, label: "About title", widget: string }
          - { name: aboutIntroCopy, label: "About intro", widget: text }
          - { name: servicesIntroEyebrow, label: "Services label", widget: string }
          - { name: servicesIntroTitle, label: "Services title", widget: string }
          - { name: servicesIntroCopy, label: "Services intro", widget: text }
          - { name: galleryIntroEyebrow, label: "Gallery label", widget: string }
          - { name: galleryIntroTitle, label: "Gallery title", widget: string }
          - { name: galleryIntroCopy, label: "Gallery intro", widget: text }
          - { name: contactIntroEyebrow, label: "Contact label", widget: string }
          - { name: contactIntroTitle, label: "Contact title", widget: string }
          - { name: contactIntroCopy, label: "Contact intro", widget: text }
          - { name: contactAsideHeading, label: "Contact sidebar heading", widget: string }
          - { name: contactAsideCopy, label: "Contact sidebar text", widget: text }
          - { name: privacyIntroEyebrow, label: "Privacy label", widget: string }
          - { name: privacyIntroTitle, label: "Privacy title", widget: string }
          - { name: privacyIntroCopy, label: "Privacy intro", widget: text }
          - { name: privacyBody, label: "Privacy body", widget: text }
          - { name: privacyFootnote, label: "Privacy footnote", widget: text }
          - { name: notFoundEyebrow, label: "404 label", widget: string }
          - { name: notFoundTitle, label: "404 title", widget: string }
          - { name: notFoundCopy, label: "404 text", widget: text }

  - name: catalogue
    label: "Services & FAQ"
    files:
      - name: services
        label: "Services"
        file: "content/services.json"
        fields:
          - name: items
            label: Services
            widget: list
            fields:
              - { name: slug, label: "Slug (do not change)", widget: string }
              - { name: href, label: "Link", widget: string }
              - { name: title, label: "Title", widget: string }
              - name: image
                label: "Photo"
                widget: select
                options:
                  - showerBrassCalacatta
                  - showerFrostedDoors
                  - railingBrassStandoffs
                  - showerRainGlass
                  - showerNickelCorner
                  - showerPandaMarble
                  - showerChromeHalfWall
                  - railingCurvedBrass
                  - railingBlackCapFoyer
                  - railingBlackPostsOak
              - { name: summary, label: "Card summary", widget: text }
              - { name: description, label: "Long description", widget: text }
              - { name: intro, label: "Detail page intro", widget: text, required: false }
              - name: details
                label: "Detail page points"
                widget: list
                required: false
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: copy, label: Text, widget: text }

      - name: faq
        label: "FAQ"
        file: "content/faq.json"
        fields:
          - name: items
            label: Questions
            widget: list
            fields:
              - { name: question, label: Question, widget: string }
              - { name: answer, label: Answer, widget: text }
